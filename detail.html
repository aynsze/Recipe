<!-- レシピ詳細 -->

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>レシピ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ヘッダー -->
    <header class="detail-header">

        <button id="backButton" class="back-button" type="button" aria-label="戻る">
            ‹
        </button>

        <h1>レシピ</h1>

        <div class="github-auth">
            <button id="githubLoginButton" class="github-login-button" type="button">
                ログイン
            </button>
        </div>
    </header>

    <main class="detail-main">

        <!-- 画像 -->
        <div id="imageWrap" class="detail-image-wrap">
            <img id="recipeImage" class="detail-image" alt="">

            <div id="noImage" class="detail-no-image">
                🍽
            </div>
        </div>

        <!-- 基本情報 -->
        <section class="detail-intro">

            <h2 id="recipeTitle" class="detail-title"></h2>

            <div id="recipeMeta" class="detail-meta"></div>

            <div id="recipeUrl" class="detail-url"></div>

        </section>

        <!-- 材料 -->
        <section class="detail-section">

            <div class="detail-section-heading">

                <h2>材料</h2>

                <p id="servingNote" class="serving-note"></p>

                <select id="servingSelect">
                    <option value="1">基本</option>
                    <option value="2">2倍</option>
                    <option value="0.5">半分</option>
                    <option value="0.33">1/3</option>
                </select>

            </div>

            <div id="ingredients" class="ingredients-list"></div>

        </section>

        <!-- 事前準備 -->
        <section id="preparationSection" class="detail-section">

            <h2>事前準備</h2>

            <ol id="preparation" class="instruction-list"></ol>

        </section>

        <!-- 手順 -->
        <section class="detail-section">

            <h2>手順</h2>

            <ol id="steps" class="instruction-list"></ol>

        </section>

        <!-- メモ -->
        <section id="memoSection" class="detail-section">

            <h2>メモ</h2>

            <div id="memo" class="detail-memo"></div>

        </section>

    </main>

    <!-- 編集ボタン -->
    <button id="editButton" class="edit-button" type="button" aria-label="レシピを編集">
        ✎
    </button>

    <!-- 編集モーダル -->
    <div id="modalBackground" class="modal-background"></div>

    <section id="recipeModal" class="recipe-modal" aria-hidden="true">

        <header class="modal-header">

            <button id="closeModalButton" class="modal-close-button" type="button" aria-label="閉じる">
                ×
            </button>

            <h2>レシピ編集</h2>

            <button id="saveRecipeButton" class="modal-save-button" type="button">
                保存
            </button>

        </header>

        <div class="modal-content">

            <!-- 基本情報 -->
            <section class="form-section">

                <div class="form-field">

                    <label for="inputTitle">
                        タイトル
                    </label>

                    <input id="inputTitle" type="text" placeholder="レシピ名">

                </div>

                <div class="form-row">

                    <div class="form-field">

                        <label for="inputCategory">
                            カテゴリ
                        </label>

                        <select id="inputCategory">
                            <option value="主食">主食</option>
                            <option value="肉類">肉類</option>
                            <option value="魚類">魚類</option>
                            <option value="副菜">副菜</option>
                            <option value="おやつ">おやつ</option>
                            <option value="他">他</option>
                        </select>

                    </div>

                    <div class="form-field">

                        <label for="inputSource">
                            出典
                        </label>

                        <select id="inputSource">
                            <option value="original">自作</option>
                            <option value="arranged">アレンジ</option>
                            <option value="reference">参考</option>
                        </select>

                    </div>

                </div>

                <div class="form-field">

                    <label for="inputRating">
                        評価
                    </label>

                    <div class="rating-input">

                        <input id="inputRating" type="range" min="0" max="5" step="1" value="0">

                        <span id="ratingValue">
                            未設定
                        </span>

                    </div>

                </div>

                <div class="form-field">

                    <label for="inputImage">
                        画像URL
                    </label>

                    <input id="inputImage" type="url" placeholder="https://...">

                </div>

                <div class="form-field">

                    <label for="inputUrl">
                        レシピURL
                    </label>

                    <input id="inputUrl" type="url" placeholder="https://...">

                </div>

            </section>

            <!-- 材料 -->
            <section class="form-section">

                <div class="section-heading">

                    <h3>材料</h3>

                    <button id="addIngredientButton" class="small-add-button" type="button">
                        ＋ 材料
                    </button>

                </div>

                <div id="ingredientsForm"></div>

            </section>

            <!-- 事前準備 -->
            <section class="form-section">

                <div class="section-heading">

                    <h3>事前準備</h3>

                    <button id="addPreparationButton" class="small-add-button" type="button">
                        ＋ 追加
                    </button>

                </div>

                <div id="preparationForm"></div>

            </section>

            <!-- 手順 -->
            <section class="form-section">

                <div class="section-heading">

                    <h3>手順</h3>

                    <button id="addStepButton" class="small-add-button" type="button">
                        ＋ 手順
                    </button>

                </div>

                <div id="stepsForm"></div>

            </section>

            <!-- メモ -->
            <section class="form-section">

                <div class="section-heading">

                    <h3>メモ</h3>

                </div>

                <textarea id="inputMemo" class="memo-input" placeholder="メモ"></textarea>

            </section>

        </div>

    </section>

    <div id="githubLoginModalBackground" class="modal-background"></div>

    <div id="githubLoginModal" class="github-login-modal">

        <div class="github-login-modal-content">

            <h2>GitHubログイン</h2>

            <label for="githubPatInput">
                Personal Access Token
            </label>

            <input id="githubPatInput" type="password" autocomplete="off" placeholder="PATを入力">

            <div class="github-login-modal-buttons">

                <button id="githubLoginCancelButton" type="button">
                    キャンセル
                </button>

                <button id="githubLoginSubmitButton" type="button">
                    ログイン
                </button>

            </div>

        </div>

    </div>

    <script type="module" src="js/recipe-detail.js"></script>

</body>

</html>
